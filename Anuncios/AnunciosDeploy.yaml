apiVersion: apps/v1
kind: Deployment
metadata:
  name: anuncios-deploy
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: anuncios
  template:
    metadata:
      labels:
        app: anuncios
    spec:
      containers:
        - name: anuncios
          image: IMAGE_TAG
          imagePullPolicy: Always
          ports:
            - containerPort: 8084
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "eks"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka.kafka.svc.cluster.local:9092"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mariadb://40.233.27.238:3307/ads_db"
            - name: SPRING_DATASOURCE_USERNAME
              value: "app_user"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "appSa456."
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://eureka-service:8765/eureka/"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 60
            periodSeconds: 10
